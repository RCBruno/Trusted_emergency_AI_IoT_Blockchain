# Hyperledger Caliper — Network Configuration
# Emergency Logistics Benchmark
# Compatible with: Hyperledger Fabric 2.4.x / 2.5.x
# Paper: "Trusted Emergency Logistics via Agentic AI, IoT, and Blockchain"

name: emergency-logistics-fabric-network
version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  - channelName: emergency-channel
    contracts:
      - id: emergency-logistics
        contractID: emergency-logistics

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: 'User1'
          clientPrivateKey:
            path: '../test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/keystore/priv_sk'
          clientSignedCert:
            path: '../test-network/organizations/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem'
    connectionProfile:
      path: './connection-org1.yaml'
      discover: true
